name: Deploy

# Publica a cada mudança no main, e a cada 3 horas pra pegar as páginas que o autor publicou
# no painel dele (as páginas prontas saem do índice da wiki na hora do build). Também dá pra
# rodar à mão em Actions › Deploy › Run workflow.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # API do jogo (fichas), no Render. Endereço público, não é segredo.
          VITE_API_URL: https://pg-backend-jfnn.onrender.com
          # "1" mostra o painel "Suas fichas" no perfil (e no menu da conta) pros jogadores; vazio,
          # só o mestre vê as fichas (perfil e "Fichas da mesa" na barra de navegação).
          VITE_FEATURE_FICHAS: "1"
      - run: npm run prerender
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
